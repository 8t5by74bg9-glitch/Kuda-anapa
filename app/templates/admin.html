<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — КУДА?</title><style>
:root{--bg:#f3f0e8;--ink:#10130e;--muted:#6e726b;--card:#fffdf8;--line:#dad5ca;--green:#214e3b;--red:#a34640}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.hero{background:var(--green);color:#fff;border-radius:24px;padding:22px;margin:18px 0}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.stat,.card,.row,.lead{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px}.stat b{font-size:24px;display:block}.stat span,.muted{font-size:11px;color:var(--muted)}button,input,select,textarea{font:inherit}.btn{border:0;border-radius:999px;padding:10px 13px;font-weight:700;cursor:pointer}.p{background:var(--ink);color:#fff}.s{background:#fff;border:1px solid var(--line)}.danger{background:#fff0ef;color:var(--red);border:1px solid #e6c6c3}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-top:16px}.list,.leads{display:grid;gap:8px}.rowhead{display:flex;justify-content:space-between;gap:10px}.field{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px}.form{display:grid;gap:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.pill{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 9px;font-size:11px;margin:3px}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><b style="font-size:25px">КУДА? / ADMIN</b><div class="actions"><a class="btn s" href="/">Сервис</a><form method="post" action="/admin/logout"><button class="btn s">Выйти</button></form></div></div><div class="hero"><small>ФИНАЛЬНАЯ ПАНЕЛЬ</small><h1>Контент, заявки и аналитика</h1><p>Единая база, QR-источники и CRM-статусы.</p></div><div class="stats"><div class="stat"><b id="scontent">0</b><span>карточек</span></div><div class="stat"><b id="sactive">0</b><span>активно</span></div><div class="stat"><b id="svisits">0</b><span>визитов</span></div><div class="stat"><b id="sviews">0</b><span>просмотров</span></div><div class="stat"><b id="sroutes">0</b><span>маршрутов</span></div><div class="stat"><b id="sleads">0</b><span>заявок</span></div></div>
<div class="grid"><div><div class="actions"><button class="btn p" onclick="newItem()">+ Добавить</button><button class="btn s" onclick="loadAll()">Обновить</button></div><h2>Контент</h2><div id="contentList" class="list"></div></div><div><div class="card"><h2 id="formTitle">Новая карточка</h2><div class="form"><input class="field" id="title" placeholder="Название"><div class="two"><select class="field" id="type"><option value="restaurant">Ресторан</option><option value="excursion">Экскурсия</option><option value="event">Афиша</option><option value="activity">Развлечение</option><option value="winery">Винодельня</option></select><input class="field" id="emoji" placeholder="Эмодзи"></div><input class="field" id="subtitle" placeholder="Подзаголовок"><textarea class="field" id="description" placeholder="Описание"></textarea><input class="field" id="address" placeholder="Адрес"><div class="two"><input class="field" id="date" placeholder="YYYY-MM-DD"><input class="field" id="time" placeholder="HH:MM"></div><div class="two"><input class="field" id="hours" placeholder="Часы"><input class="field" id="price" placeholder="Цена"></div><div class="two"><input class="field" id="rating" placeholder="Рейтинг"><input class="field" id="kids" placeholder="Возраст"></div><input class="field" id="phone" placeholder="Телефон"><input class="field" id="url" placeholder="Сайт"><input class="field" id="map" placeholder="Карта"><input class="field" id="photo" placeholder="URL фотографии"><div class="two"><input class="field" id="source" placeholder="Источник"><input class="field" id="verified" placeholder="Проверено, например 14.09.2026"></div><div class="two"><label class="field"><input type="checkbox" id="active" checked> Активно</label><label class="field"><input type="checkbox" id="featured"> Рекомендуем</label></div><label class="field"><input type="checkbox" id="partner"> Партнёр</label><button class="btn p" onclick="saveItem()">Сохранить</button></div></div><h2>QR-источники</h2><div class="card"><div class="two"><input class="field" id="qrHotel" placeholder="slug отеля, например bavaria"><button class="btn p" onclick="makeQr()">Создать QR</button></div><div id="qrBox" style="margin-top:10px"></div></div><div id="hotelList"></div><h2>Топ карточек</h2><div id="topList"></div><h2>Заявки</h2><div id="leadList" class="leads"></div></div></div></div>
<script>
let content=[],editing=null;async function api(u,o){let r=await fetch(u,o);if(r.status===401){location.href="/admin/login";throw Error("auth")}if(!r.ok)throw Error(await r.text());return r.json()}
async function loadAll(){content=await api("/api/content?include_inactive=true");let d=await api("/api/admin/dashboard");for(let [k,v] of Object.entries(d.stats))document.getElementById("s"+k).textContent=v;contentList.innerHTML=content.map(x=>`<div class="row"><div class="rowhead"><div><b>${x.emoji||"📍"} ${x.title}</b><div class="muted">${x.type} · ${x.address||x.date||""}</div></div><span class="pill">${x.active?"АКТИВНО":"СКРЫТО"}</span></div><div class="actions"><button class="btn s" onclick="editItem('${x.id}')">Редактировать</button><button class="btn danger" onclick="delItem('${x.id}')">Удалить</button></div></div>`).join("");hotelList.innerHTML=d.hotels.map(h=>`<span class="pill">${h.hotel}: ${h.visits}</span>`).join("")||'<span class="muted">Нет данных</span>';topList.innerHTML=d.top.map(t=>`<span class="pill">${t.content_id}: ${t.views}</span>`).join("")||'<span class="muted">Нет данных</span>';leadList.innerHTML=d.leads.map(l=>`<div class="lead"><b>#${l.id} ${l.name}</b> · ${l.phone}<div class="muted">hotel=${l.hotel} · content=${l.content_id||"—"}</div><select class="field" onchange="leadStatus(${l.id},this.value)"><option ${l.status==="new"?"selected":""}>new</option><option ${l.status==="contacted"?"selected":""}>contacted</option><option ${l.status==="booked"?"selected":""}>booked</option><option ${l.status==="cancelled"?"selected":""}>cancelled</option></select><textarea class="field" placeholder="Заметка" onblur="leadNote(${l.id},this.value)">${l.note||""}</textarea></div>`).join("")||'<div class="muted">Заявок нет</div>'}
function newItem(){editing=null;for(let k of ["title","emoji","subtitle","description","address","date","time","hours","price","rating","kids","phone","url","map","photo","source","verified"])document.getElementById(k).value="";type.value="restaurant";active.checked=true;featured.checked=false;partner.checked=false;formTitle.textContent="Новая карточка"}function editItem(i){let x=content.find(v=>v.id===i);editing=i;for(let k of ["title","emoji","subtitle","description","address","date","time","hours","price","rating","kids","phone","url","map","photo","source","verified"])document.getElementById(k).value=x[k]||"";type.value=x.type;active.checked=!!x.active;featured.checked=!!x.featured;partner.checked=!!x.partner;formTitle.textContent="Редактировать"}function payload(){let o={};for(let k of ["title","emoji","subtitle","description","address","date","time","hours","price","rating","kids","phone","url","map","photo","source","verified"])o[k]=document.getElementById(k).value.trim();o.type=type.value;o.active=active.checked;o.featured=featured.checked;o.partner=partner.checked;o.budget=2;o.duration=2;o.mood="any";return o}
async function saveItem(){let data=payload();if(!data.title)return alert("Название обязательно");await api(editing?"/api/content/"+editing:"/api/content",{method:editing?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({data})});newItem();loadAll()}async function delItem(i){if(!confirm("Удалить?"))return;await api("/api/content/"+i,{method:"DELETE"});loadAll()}async function leadStatus(i,s){await api("/api/leads/"+i,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:s})})}async function leadNote(i,n){await api("/api/leads/"+i,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({note:n})})}
function makeQr(){let h=(qrHotel.value||"direct").trim();if(!h)return;let src="/api/admin/qr?hotel="+encodeURIComponent(h)+"&t="+Date.now();qrBox.innerHTML=`<img src="${src}" style="width:220px;max-width:100%;border-radius:16px;background:#fff;padding:10px"><div class="actions"><a class="btn s" href="/api/admin/qr?hotel=${encodeURIComponent(h)}" download="kuda-${h}-qr.png">Скачать PNG</a><a class="btn s" target="_blank" href="/?hotel=${encodeURIComponent(h)}">Открыть ссылку</a></div>`}
loadAll();
</script></body></html>
