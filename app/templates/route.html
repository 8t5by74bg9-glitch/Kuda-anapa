<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Маршрут — КУДА?</title><link rel="stylesheet" href="/static/app.css"></head><body><div class="app"><div class="top"><a class="logo" href="/">КУДА?</a><span class="circle">Маршрут</span></div><div style="padding:18px"><div class="ey">ГОТОВЫЙ МАРШРУТ</div><h1 style="font-size:50px;line-height:.95;letter-spacing:-.06em;margin:10px 0">Мой день<br>в Анапе</h1><p class="muted">Источник: {{ hotel }}</p>{% for item in items %}<div class="item"><div class="routeRow"><div class="routeNum">{{ loop.index }}</div><div><b>{{ item.emoji }} {{ item.title }}</b><div class="muted" style="margin:4px 0 9px">{{ item.address or item.subtitle }}</div>{% if item.map %}<a class="btn s" target="_blank" href="https://yandex.ru/maps/?text={{ item.map|urlencode }}">Открыть точку</a>{% endif %}</div></div></div>{% endfor %}<a class="btn p" href="/">Собрать свой маршрут</a></div></div></body></html>
